<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sexta-Feira — Cérebro</title>
  <style>
    :root {
      --bg: #02060d;
      --cyan: #00e5ff;
      --cyan-dim: #0a4a5c;
      --blue: #4f7cff;
      --purple: #a78bfa;
      --green: #22d3a0;
      --orange: #ffb020;
      --red: #ff4d6d;
      --text: #d7f6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 50% -10%, #0a2433 0%, transparent 60%),
        radial-gradient(800px 500px at 80% 100%, #10163a 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    .hud {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 22px;
      border-bottom: 1px solid rgba(0,229,255,.12);
      backdrop-filter: blur(8px);
    }
    footer {
      border-bottom: none;
      border-top: 1px solid rgba(0,229,255,.12);
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 15px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--cyan);
      font-weight: 600;
    }
    .badge {
      font-size: 12px;
      color: #8fdfff;
      border: 1px solid rgba(0,229,255,.25);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0, 40, 55, .45);
    }
    .stage {
      position: relative;
      display: grid;
      place-items: center;
    }
    canvas {
      width: min(920px, 96vw);
      height: min(620px, 72vh);
      border: 1px solid rgba(0,229,255,.12);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(0,40,60,.25), rgba(0,0,0,.15));
      box-shadow:
        0 0 40px rgba(0,229,255,.08),
        inset 0 0 60px rgba(0,229,255,.04);
    }
    .modes {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: 1px solid rgba(0,229,255,.28);
      background: rgba(0, 30, 45, .7);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: .04em;
      transition: .15s ease;
    }
    button:hover { border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,.2); }
    button.active {
      background: rgba(0, 229, 255, .12);
      border-color: var(--cyan);
      color: white;
      box-shadow: 0 0 16px rgba(0,229,255,.25);
    }
    .readout {
      font-size: 12px;
      color: #9adfff;
      min-width: 220px;
      text-align: right;
    }
    .scanlines {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,.08) 3px
      );
      opacity: .25;
    }
  </style>
</head>
<body>
  <div class="hud">
    <header>
      <h1>Sexta-Feira // Neural Core</h1>
      <div class="badge" id="stateBadge">IDLE · baseline</div>
    </header>

    <div class="stage">
      <canvas id="brain" width="1100" height="720"></canvas>
      <div class="scanlines"></div>
    </div>

    <footer>
      <div class="modes">
        <button data-mode="idle" class="active">Idle</button>
        <button data-mode="listen">Ouvir</button>
        <button data-mode="think">Pensar</button>
        <button data-mode="speak">Falar</button>
        <button data-mode="process">Processar</button>
      </div>
      <div class="readout" id="readout">
        atividade global: 0%<br/>
        sincronia: estável
      </div>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById("brain");
    const ctx = canvas.getContext("2d");
    const stateBadge = document.getElementById("stateBadge");
    const readout = document.getElementById("readout");

    // Modos inspirados em padrões macro de atividade cerebral
    // (estilizado / cinematográfico, não é diagnóstico médico)
    const MODES = {
      idle: {
        label: "IDLE · baseline",
        color: "#00e5ff",
        global: 0.18,
        sync: 0.25,
        speed: 0.6,
        focus: null,          // atividade difusa baixa
        pulse: 0.15
      },
      listen: {
        label: "LISTEN · temporal",
        color: "#4f7cff",
        global: 0.42,
        sync: 0.45,
        speed: 1.1,
        focus: "temporal",    // lados / "ouvido"
        pulse: 0.35
      },
      think: {
        label: "THINK · prefrontal",
        color: "#a78bfa",
        global: 0.62,
        sync: 0.7,
        speed: 1.4,
        focus: "frontal",
        pulse: 0.55
      },
      speak: {
        label: "SPEAK · motor / broca",
        color: "#22d3a0",
        global: 0.55,
        sync: 0.6,
        speed: 1.25,
        focus: "broca",
        pulse: 0.7
      },
      process: {
        label: "PROCESS · wide network",
        color: "#ffb020",
        global: 0.8,
        sync: 0.85,
        speed: 1.8,
        focus: "all",
        pulse: 0.9
      }
    };

    let mode = "idle";
    let t = 0;
    let nodes = [];
    let edges = [];

    function brainPoint(angle, rx, ry, cx=550, cy=360) {
      // Contorno tipo cérebro (superelipse irregular)
      const wobble = 1 + 0.08 * Math.sin(angle * 3) + 0.05 * Math.cos(angle * 5);
      return {
        x: cx + Math.cos(angle) * rx * wobble,
        y: cy + Math.sin(angle) * ry * wobble * 0.92
      };
    }

    function initNetwork() {
      nodes = [];
      edges = [];
      const regions = {
        frontal: [],
        temporalL: [],
        temporalR: [],
        parietal: [],
        occipital: [],
        broca: [],
        core: []
      };

      // Nós em regiões
      for (let i = 0; i < 160; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 0.25 + Math.random() * 0.75;
        const p = brainPoint(a, 320 * r, 250 * r);
        // jitter interno
        p.x += (Math.random() - 0.5) * 26;
        p.y += (Math.random() - 0.5) * 26;

        let region = "core";
        if (p.x < 430 && p.y < 340) region = "broca";
        else if (p.x < 500) region = "frontal";
        else if (p.x > 650 && p.y < 380) region = "temporalR";
        else if (p.x < 420 && p.y > 300) region = "temporalL";
        else if (p.y > 430) region = "occipital";
        else if (p.y < 300) region = "parietal";

        const node = {
          ...p,
          region,
          phase: Math.random() * Math.PI * 2,
          base: 0.2 + Math.random() * 0.5,
          fire: 0
        };
        nodes.push(node);
        if (regions[region]) regions[region].push(node);
        else regions.core.push(node);
      }

      // Conexões locais + algumas longas
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const d = Math.hypot(dx, dy);
          if (d < 70 || (d < 160 && Math.random() < 0.03)) {
            edges.push({ a: i, b: j, d });
          }
        }
      }
    }

    function regionBoost(node, m) {
      if (!m.focus || m.focus === "all") return m.focus === "all" ? 1 : 0.15;
      if (m.focus === "frontal") return node.region === "frontal" || node.region === "parietal" ? 1 : 0.2;
      if (m.focus === "temporal") return node.region === "temporalL" || node.region === "temporalR" ? 1 : 0.18;
      if (m.focus === "broca") return node.region === "broca" || node.region === "frontal" ? 1 : 0.2;
      return 0.2;
    }

    function drawBrainOutline(color, alpha=0.35) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 200; i++) {
        const a = (i / 200) * Math.PI * 2;
        const p = brainPoint(a, 340, 265);
        if (i === 0) ctx.moveTo(p.x, p.y);
        else ctx.lineTo(p.x, p.y);
      }
      ctx.closePath();
      ctx.stroke();

      // divisão hemisférios
      ctx.beginPath();
      ctx.moveTo(550, 140);
      ctx.bezierCurveTo(560, 250, 540, 420, 550, 560);
      ctx.stroke();
      ctx.restore();
    }

    function frame() {
      t += 0.016 * MODES[mode].speed;
      const m = MODES[mode];

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // grid HUD
      ctx.save();
      ctx.strokeStyle = "rgba(0,229,255,0.05)";
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }
      ctx.restore();

      drawBrainOutline(m.color, 0.4);

      // edges / sinais
      for (const e of edges) {
        const na = nodes[e.a];
        const nb = nodes[e.b];
        const act = (na.fire + nb.fire) * 0.5;
        if (act < 0.08) continue;
        ctx.strokeStyle = m.color;
        ctx.globalAlpha = Math.min(0.55, act * 0.55);
        ctx.lineWidth = 1 + act * 1.5;
        ctx.beginPath();
        ctx.moveTo(na.x, na.y);
        ctx.lineTo(nb.x, nb.y);
        ctx.stroke();

        // pulso viajando na sinapse
        const pulse = (t * 0.9 + e.a * 0.01) % 1;
        const px = na.x + (nb.x - na.x) * pulse;
        const py = na.y + (nb.y - na.y) * pulse;
        ctx.globalAlpha = act;
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(px, py, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      // nodes / spikes
      let avg = 0;
      for (const n of nodes) {
        const boost = regionBoost(n, m);
        const wave =
          0.5 + 0.5 * Math.sin(t * 2.2 + n.phase) *
          (0.4 + 0.6 * m.sync);
        const spikeChance = m.global * boost * n.base;
        // spike discreto tipo potencial de ação estilizado
        if (Math.random() < spikeChance * 0.07) n.fire = 1;
        n.fire *= 0.90;

        const intensity = Math.min(1, n.fire * 0.9 + wave * m.global * boost * 0.35);
        avg += intensity;

        const r = 1.4 + intensity * 4.2;
        const g = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 3);
        g.addColorStop(0, m.color);
        g.addColorStop(1, "transparent");
        ctx.fillStyle = g;
        ctx.globalAlpha = 0.25 + intensity * 0.75;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 2.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.7 + intensity * 0.3;
        ctx.fillStyle = intensity > 0.6 ? "#fff" : m.color;
        ctx.beginPath();
        ctx.arc(n.x, n.y, Math.max(1.2, r * 0.35), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      avg /= nodes.length;

      // ondas macro (tipo EEG estilizado embaixo)
      ctx.save();
      ctx.translate(80, 640);
      ctx.strokeStyle = m.color;
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x < 940; x++) {
        const y =
          Math.sin(x * 0.03 + t * 3) * (8 + m.pulse * 10) +
          Math.sin(x * 0.01 - t * 2) * (4 + avg * 12) +
          Math.sin(x * 0.12 + t * 6) * (m.pulse > 0.5 ? 3 : 0.8);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.restore();

      stateBadge.textContent = m.label;
      readout.innerHTML =
        `atividade global: ${Math.round(avg * 100)}%<br/>` +
        `sincronia: ${Math.round(m.sync * 100)}% · modo ${mode}`;

      requestAnimationFrame(frame);
    }

    // UI
    document.querySelectorAll("button[data-mode]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("button[data-mode]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        mode = btn.dataset.mode;
      });
    });

    // API pública para a Sexta controlar depois:
    // window.SextaBrain.setMode('think' | 'listen' | 'speak' | 'process' | 'idle')
    window.SextaBrain = {
      setMode(next) {
        if (!MODES[next]) return;
        mode = next;
        document.querySelectorAll("button[data-mode]").forEach(b => {
          b.classList.toggle("active", b.dataset.mode === next);
        });
      }
    };

    // Sincroniza com a API da Sexta
    async function syncEstado() {
      try {
        const r = await fetch("/api/estado");
        const data = await r.json();
        if (data && data.mode && data.mode !== mode) {
        window.SextaBrain.setMode(data.mode);
       }
     } catch (e) {}
   }
   setInterval(syncEstado, 400);
   syncEstado();

    initNetwork();
    frame();
  </script>
</body>
</html>
